# The factory stub. Copy it to a target repo as .github/workflows/factory.yml.
# It only forwards: routing, the allowlist, timeouts and caps all live in the
# factory's reusable workflows, so changing them never means touching this file.
name: factory

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize]
  # Chaining (no inputs), review's backstop (pr only) and, once it exists,
  # rework (all three).
  workflow_dispatch:
    inputs:
      ticket:
        type: string
        required: false
      pr:
        type: string
        required: false
      round:
        type: string
        required: false
  # The daily backstop: the implementer picks up the oldest ready ticket, and
  # review re-reviews every open agent PR whose head has no verdict.
  schedule:
    - cron: "0 2 * * *"

jobs:
  implementer:
    uses: the-kwisatz-haderach/sw-factory/.github/workflows/implementer.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      actions: write
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  review:
    uses: the-kwisatz-haderach/sw-factory/.github/workflows/review.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      actions: write
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
