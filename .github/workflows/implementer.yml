# The implementer task (docs/factory-design.md §7), called by a target repo's
# stub. Everything here runs in the target repo: its minutes, logs and secrets.
#
# An allowlisted actor adds `agent:ready`, the run claims the oldest ready
# ticket, the agent builds it with the factory plugin, and on outcome `done`
# the branch is pushed and the PR opened as `claude[bot]`. If the ticket's
# branch already has an open PR, the run continues that PR instead: new
# commits on its branch, no force-push, the body rewritten. Without one, a
# leftover branch of the same name is deleted before the push.
#
# Every other ending leaves the ticket labelled, with a comment and the run
# link, and pushes nothing:
# - no `## Checks` on the default branch (pre-flight), outcome `needs-human`,
#   or a branch that changes the `## Checks` section → `agent:needs-human`
# - anything that breaks the run (a failed step, a missing or malformed
#   outcome file, a timeout, a cancel) → `agent:failed`, by `report-failure`
name: implementer

on:
  workflow_call:
    inputs:
      allowlist:
        description: >-
          Comma-separated logins, no spaces, that may start a run. Checked
          against who performed the triggering action (who added the label),
          not who opened the ticket. Bots on it start only the triggers a task
          names for them, and the implementer names none: adding agent:ready is
          a human trigger.
        type: string
        default: "the-kwisatz-haderach,claude[bot]"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  implement:
    if: >-
      github.event_name == 'issues'
      && github.event.action == 'labeled'
      && github.event.label.name == 'agent:ready'
      && !github.event.issue.pull_request
      && contains(format(',{0},', inputs.allowlist), format(',{0},', github.triggering_actor))
      && !endsWith(github.triggering_actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    # Read by report-failure, which runs even after a timeout or a cancel.
    outputs:
      ticket: ${{ steps.pick.outputs.ticket }}
      auth_failed: ${{ steps.auth.outputs.failed }}
    env:
      # Deliberately no job-level GH_TOKEN: the agent step must not inherit a
      # token it could use to touch labels. Each bookkeeping step sets its own.
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_DIR: .factory-run
    steps:
      # The plugin comes from the exact commit of this running workflow, so the
      # instructions and the workflow can never skew. It is moved out of the
      # workspace so the target checkout can't see, load or commit it.
      - name: Check out the factory plugin
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory-plugin
          persist-credentials: false

      - name: Move the factory plugin out of the workspace
        run: |
          mv .factory-plugin "$RUNNER_TEMP/factory"
          echo "FACTORY=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"

      - name: Pick the oldest ready ticket
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ticket="$(gh api --paginate --slurp "repos/$GH_REPO/issues?labels=agent%3Aready&state=open&per_page=100" \
            | jq 'add // []' | "$FACTORY/scripts/implementer/pick-ticket")"
          if [ -z "$ticket" ]; then
            echo "No \`agent:ready\` ticket; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "TICKET=$ticket" >> "$GITHUB_ENV"
          echo "BRANCH=agent/issue-$ticket" >> "$GITHUB_ENV"
          echo "ticket=$ticket" >> "$GITHUB_OUTPUT"
          echo "Ticket: #$ticket" >> "$GITHUB_STEP_SUMMARY"

      # Before the claim and before any tokens are spent: without `## Checks`
      # on the default branch there is nothing to judge the work by.
      - name: Pre-flight
        if: env.TICKET != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$FACTORY/scripts/implementer/fetch-default-claude-md" "$RUNNER_TEMP/default-claude.md"
          if "$FACTORY/scripts/implementer/checks-section" "$RUNNER_TEMP/default-claude.md" > /dev/null; then
            exit 0
          fi
          gh issue comment "$TICKET" --body-file - <<EOF
          The factory can't start on this ticket: \`CLAUDE.md\` on \`$DEFAULT_BRANCH\` has no \`## Checks\` section, so there are no commands to judge the work by. Add one on \`$DEFAULT_BRANCH\`, then re-add \`agent:ready\`.

          Run: $RUN_URL
          EOF
          gh issue edit "$TICKET" --remove-label agent:ready --add-label agent:needs-human
          echo "Pre-flight: no \`## Checks\` in \`CLAUDE.md\` on \`$DEFAULT_BRANCH\`; ticket handed back." >> "$GITHUB_STEP_SUMMARY"
          # Nothing else runs for this ticket.
          echo "TICKET=" >> "$GITHUB_ENV"

      - name: Claim the ticket
        if: env.TICKET != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "$TICKET" --remove-label agent:ready --add-label agent:in-progress

      # An open PR from the ticket's branch means rework on request: the run
      # continues that PR rather than starting over from the default branch.
      - name: Find an open PR to continue
        if: env.TICKET != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository \
            | "$FACTORY/scripts/implementer/pr-to-continue")"
          echo "PR_NUMBER=$pr" >> "$GITHUB_ENV"
          if [ -n "$pr" ]; then
            echo "Continuing PR #$pr" >> "$GITHUB_STEP_SUMMARY"
          fi

      # No persisted credentials: the agent step must hold no GITHUB_TOKEN, and
      # the push step brings its own.
      - name: Check out the target repo
        if: env.TICKET != ''
        uses: actions/checkout@v6
        with:
          # The PR branch when continuing a PR, else the default branch.
          ref: ${{ env.PR_NUMBER != '' && env.BRANCH || '' }}
          persist-credentials: false

      - name: Run the target repo's factory-setup
        if: env.TICKET != '' && hashFiles('.github/actions/factory-setup/action.yml', '.github/actions/factory-setup/action.yaml') != ''
        uses: ./.github/actions/factory-setup

      - name: Prepare the branch and run directory
        if: env.TICKET != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Steps run without pipefail; a failed `gh` below must fail the step.
          set -o pipefail
          # When continuing a PR the checkout is already on its branch, and
          # BASE_SHA is the PR's head, so the checks below see only new commits.
          if [ -z "$PR_NUMBER" ]; then
            git checkout -b "$BRANCH"
          fi
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # The run directory is git-ignored for this checkout only, so the
          # agent's outcome file and PR body can never be committed.
          mkdir -p "$RUN_DIR"
          echo "/$RUN_DIR/" >> .git/info/exclude
          gh issue view "$TICKET" --json number,title,body,comments \
            | "$FACTORY/scripts/ticket-thread" > "$RUN_DIR/ticket.md"
          if [ -n "$PR_NUMBER" ]; then
            fetch() { gh api --paginate --slurp "repos/$GH_REPO/$1?per_page=100" | jq 'add // []'; }
            fetch "issues/$PR_NUMBER/comments" > "$RUNNER_TEMP/pr-comments.json"
            fetch "pulls/$PR_NUMBER/reviews" > "$RUNNER_TEMP/pr-reviews.json"
            fetch "pulls/$PR_NUMBER/comments" > "$RUNNER_TEMP/pr-review-comments.json"
            gh pr view "$PR_NUMBER" --json number,title,url \
              | jq --slurpfile comments "$RUNNER_TEMP/pr-comments.json" \
                   --slurpfile reviews "$RUNNER_TEMP/pr-reviews.json" \
                   --slurpfile review_comments "$RUNNER_TEMP/pr-review-comments.json" \
                   '. + {comments: $comments[0], reviews: $reviews[0], review_comments: $review_comments[0]}' \
              | "$FACTORY/scripts/implementer/pr-context" > "$RUN_DIR/pr.md"
          fi

      - name: Implement
        id: claude
        if: env.TICKET != ''
        timeout-minutes: 40
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action's default bot_id (41898282) is github-actions[bot]'s, so
          # commits would be attributed to it. 209825114 is claude[bot]'s.
          bot_id: "209825114"
          bot_name: "claude[bot]"
          prompt: |
            /factory:implementer
            Ticket: #${{ env.TICKET }}
            Run directory: ${{ env.RUN_DIR }}/
            ${{ env.PR_NUMBER != '' && format('Open PR: #{0}', env.PR_NUMBER) || 'Open PR: none' }}
          claude_args: >-
            --plugin-dir ${{ runner.temp }}/factory
            --add-dir ${{ runner.temp }}/factory
            --append-system-prompt-file ${{ runner.temp }}/factory/system.md

      # Read before anything else can fail, so report-failure can tell an
      # expired or revoked Claude token from any other breakage.
      - name: Check for a rejected Claude token
        id: auth
        if: always() && env.TICKET != '' && steps.claude.outcome != 'skipped'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: |
          if "$FACTORY/scripts/implementer/auth-failed" "$EXECUTION_FILE"; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::The Claude token was rejected (authentication_failed)."
          fi

      # Deterministic from here on: the agent never pushes or touches labels.
      # Sets `route`: what happens next. The agent's `done` or `needs-human`,
      # or `checks-changed` when the branch changes `## Checks`. A missing or
      # malformed outcome file, or a `done` that breaks the contract, fails
      # the run instead.
      - name: Check the outcome
        id: outcome
        if: env.TICKET != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! outcome="$("$FACTORY/scripts/implementer/read-outcome" "$RUN_DIR/outcome.json" "$RUNNER_TEMP/agent-comment.md")"; then
            echo "::error::The outcome file is missing or malformed."
            exit 1
          fi
          echo "Outcome: \`$outcome\`" >> "$GITHUB_STEP_SUMMARY"
          route="$outcome"
          if [ "$route" = "done" ]; then
            # The whole PR, not just this run's commits, must leave the
            # commands it is judged by as the default branch defines them.
            # Fetched only now, after the agent step, so the agent never
            # holds this copy. A retry can't fix a change here, so it goes
            # to a human rather than failing the run.
            "$FACTORY/scripts/implementer/fetch-default-claude-md" "$RUNNER_TEMP/default-claude.md"
            # Committed CLAUDE.md only: uncommitted edits are never pushed.
            git show HEAD:CLAUDE.md > "$RUNNER_TEMP/head-claude.md" 2>/dev/null || rm -f "$RUNNER_TEMP/head-claude.md"
            if ! "$FACTORY/scripts/implementer/checks-unchanged" "$RUNNER_TEMP/default-claude.md" "$RUNNER_TEMP/head-claude.md" \
                 > "$RUNNER_TEMP/checks-diff.txt"; then
              route="checks-changed"
              echo "Branch changes \`CLAUDE.md\`'s \`## Checks\` section; handed back." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ "$route" = "done" ]; then
            "$FACTORY/scripts/implementer/check-pr-body" "$RUN_DIR/pr-body.md" "$TICKET"
            if [ "$(git rev-parse --abbrev-ref HEAD)" != "$BRANCH" ]; then
              echo "::error::The agent left branch $BRANCH."
              exit 1
            fi
            if [ "$(git rev-list --count "$BASE_SHA..HEAD")" -eq 0 ]; then
              echo "::error::Outcome is 'done' but the agent made no commits."
              exit 1
            fi
            forbidden="$(git diff --name-only "$BASE_SHA" HEAD | grep -E "^(\.github/workflows/|\.github/actions/factory-setup/|$RUN_DIR/)" || true)"
            if [ -n "$forbidden" ]; then
              echo "::error::The agent committed files it must never touch: $forbidden"
              exit 1
            fi
            if [ -n "$(git status --porcelain)" ]; then
              echo "::warning::Uncommitted changes left by the agent are not pushed."
            fi
          fi
          echo "route=$route" >> "$GITHUB_OUTPUT"

      # Nothing is pushed. The agent's own question is posted as claude[bot],
      # the factory's notes and the label as GITHUB_TOKEN.
      - name: Hand the ticket back to a human
        if: steps.outcome.outputs.route == 'needs-human' || steps.outcome.outputs.route == 'checks-changed'
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE: ${{ steps.outcome.outputs.route }}
        run: |
          if [ "$ROUTE" = "needs-human" ]; then
            token="$("$FACTORY/scripts/implementer/claude-app-token" mint)"
            echo "::add-mask::$token"
            trap '"$FACTORY/scripts/implementer/claude-app-token" revoke "$token"' EXIT
            { cat "$RUNNER_TEMP/agent-comment.md"; printf '\n\n---\n\nRun: %s\n' "$RUN_URL"; } \
              | GH_TOKEN="$token" gh issue comment "$TICKET" --body-file -
          else
            {
              echo "The work on \`$BRANCH\` changes \`CLAUDE.md\`'s \`## Checks\` section, so it can't be judged by the commands on \`$DEFAULT_BRANCH\`. A retry can't pass until that change lands on \`$DEFAULT_BRANCH\` or is dropped from the branch. Then re-add \`agent:ready\`."
              echo
              # Tildes: the section's own ``` fence shows up in the diff as
              # " ```", which would close a backtick fence early.
              echo '~~~~diff'
              cat "$RUNNER_TEMP/checks-diff.txt"
              echo '~~~~'
              echo
              echo "Run: $RUN_URL"
            } | gh issue comment "$TICKET" --body-file -
          fi
          gh issue edit "$TICKET" --remove-label agent:in-progress --add-label agent:needs-human

      - name: Push and open the PR as claude[bot]
        if: steps.outcome.outputs.route == 'done'
        env:
          GITHUB_TOKEN_FOR_READS: ${{ github.token }}
        run: |
          token="$("$FACTORY/scripts/implementer/claude-app-token" mint)"
          echo "::add-mask::$token"
          trap '"$FACTORY/scripts/implementer/claude-app-token" revoke "$token"' EXIT

          remote="https://x-access-token:${token}@${GITHUB_SERVER_URL#https://}/${GH_REPO}.git"
          git() { command git -c "http.${GITHUB_SERVER_URL}/.extraheader=" "$@"; }

          # Without an open PR, a leftover branch (its PR closed or merged) is
          # deleted, so the fresh branch from the default branch can be pushed
          # without a force-push.
          if [ -z "$PR_NUMBER" ]; then
            leftover="$(git ls-remote --heads "$remote" "refs/heads/$BRANCH" | cut -f1)"
            if [ -n "$leftover" ]; then
              git push "$remote" --delete "refs/heads/$BRANCH"
              echo "Deleted leftover branch \`$BRANCH\` at \`$leftover\`, which had no open PR." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # A plain push, never a force-push: continuing a PR only adds commits.
          git push "$remote" "HEAD:refs/heads/$BRANCH"

          title="$(GH_TOKEN="$GITHUB_TOKEN_FOR_READS" gh issue view "$TICKET" --json title --jq .title)"
          { cat "$RUN_DIR/pr-body.md"; printf '\n\n---\n\nRun: %s\n' "$RUN_URL"; } > "$RUNNER_TEMP/pr-body.md"
          if [ -n "$PR_NUMBER" ]; then
            # Same PR: the body is rewritten in full, the title follows the ticket.
            GH_TOKEN="$token" gh pr edit "$PR_NUMBER" \
              --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
            pr_url="$(GH_TOKEN="$GITHUB_TOKEN_FOR_READS" gh pr view "$PR_NUMBER" --json url --jq .url)"
          else
            pr_url="$(GH_TOKEN="$token" gh pr create \
              --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "$title" --body-file "$RUNNER_TEMP/pr-body.md")"
          fi
          echo "PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Move the ticket to in-review
        if: steps.outcome.outputs.route == 'done'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "$TICKET" --remove-label agent:in-progress --add-label agent:in-review

  # A separate job, because a timed-out or cancelled job skips its own
  # failure() steps (docs/factory-design.md §13 item 4). Any run that claimed a
  # ticket and then broke lands here; the steps that push are gated on a clean
  # `done`, so nothing partial was pushed.
  report-failure:
    needs: implement
    if: (failure() || cancelled()) && needs.implement.outputs.ticket != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TICKET: ${{ needs.implement.outputs.ticket }}
      AUTH_FAILED: ${{ needs.implement.outputs.auth_failed }}
    steps:
      - name: Mark the ticket failed
        run: |
          if [ "$AUTH_FAILED" = "true" ]; then
            reason="The Claude token was rejected (\`authentication_failed\`): it has expired or been revoked. Rotate the Claude token (\`CLAUDE_CODE_OAUTH_TOKEN\`), then re-add \`agent:ready\`."
          else
            reason="The implementer run broke before it finished (a failed step, a timeout or a cancel). See the run for what went wrong, then re-add \`agent:ready\` to retry."
          fi
          printf '%s\n\nRun: %s\n' "$reason" "$RUN_URL" | gh issue comment "$TICKET" --body-file -
          gh issue edit "$TICKET" --remove-label agent:ready --remove-label agent:in-progress --add-label agent:failed
