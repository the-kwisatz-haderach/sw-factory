# The automated review task (docs/factory-design.md §8), called by a target
# repo's stub. Everything here runs in the target repo: its minutes, logs and
# secrets.
#
# A PR from an `agent/issue-<n>` branch, opened or pushed by an allowlisted
# actor (`claude[bot]`, or the owner pushing a fix by hand), gets a cold
# review of its head commit: the agent reads the diff, the ticket, the
# standards and the PR body's Evidence and Merge Danger, and writes a review
# and a review verdict. A second job then posts one `claude[bot]` comment
# review with inline comments and sets the `factory/review` commit status on
# the head SHA, `success` or `failure`, linking to the review. Both jobs
# succeed either way, so a red job only ever means the run broke. A run that
# breaks, is cancelled or hits the subscription's usage limit sets
# `factory/review` to `error` instead, linking to the run: not a verdict, so
# the commit is reviewed again (§8 Failure behaviour, §10).
#
# A `fail` sends the PR back for rework (§8.3): the ticket goes back to
# `agent:ready` and the implementer is dispatched with ticket, PR and round,
# continuing the PR and reading the review; its push starts a new review.
# After REWORK_CAP automatic rounds since the owner last added `agent:ready`,
# the ticket goes to `agent:needs-human` instead.
#
# The daily backstop (`schedule`, §8.1) re-reviews every open agent PR whose
# head SHA has no verdict, `success` or `failure`: it dispatches the stub once
# per PR with the `pr` input, so each backstop review is a run of its own,
# shaped like a push's, with its own verdict or `error`.
#
# An agent PR closed without merging hands its ticket back: `agent:in-review`
# goes to `agent:needs-human`, with a comment (§5 Ticket ↔ PR).
#
# The review never pushes code and never runs checks: the target repo's PR CI
# is the deterministic gate, and runs alongside this without being read. The
# split keeps it that way by permission, not by instruction: the job the agent
# runs in can only read, and the job that writes runs no agent.
name: review

on:
  workflow_call:
    inputs:
      allowlist:
        description: >-
          Comma-separated logins, no spaces, that may start a review. Checked
          against who performed the triggering action (who opened or pushed),
          not who opened the PR. `claude[bot]` is on it because its PR opens
          and pushes are the one trigger the factory names for it.
        type: string
        default: "the-kwisatz-haderach,claude[bot]"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  # The daily backstop (§8.1, §10): no agent runs here. A commit whose review
  # broke, was cancelled or hit the usage limit has no verdict, and nothing
  # else would review it until the next push. Each unruled head gets a
  # dispatch of the stub with the `pr` input, which the review job below takes;
  # dispatches with GITHUB_TOKEN start runs (§13 item 6). Fail-closed: a head
  # whose status can't be read is left for the next night rather than
  # risk reviewing a commit already ruled on. The review run checks again.
  backstop:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: read
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # A schedule event runs on the default branch.
      DEFAULT_BRANCH: ${{ github.ref_name }}
      STUB_REF: ${{ github.workflow_ref }}
    steps:
      - name: Check out the factory plugin
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory-plugin
          persist-credentials: false

      - name: Dispatch a review for each unruled agent PR
        run: |
          set -o pipefail
          factory=.factory-plugin
          gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100" \
            | jq 'add // []' | "$factory/scripts/review/agent-prs" "$GH_REPO" > "$RUNNER_TEMP/prs.tsv"
          # STUB_REF is "<owner>/<repo>/.github/workflows/<file>@<ref>".
          stub="${STUB_REF%%@*}"
          stub="${stub##*/}"
          dispatched=0 ruled=0 unread=0 exit_code=0
          # Read on fd 3, so nothing in the loop can eat the list.
          while IFS=$'\t' read -r number head_sha _ <&3; do
            if ! statuses="$(gh api "repos/$GH_REPO/commits/$head_sha/status?per_page=100")"; then
              echo "::warning::Could not read the status of PR #$number's head; left for the next backstop."
              unread=$((unread + 1))
              continue
            fi
            if "$factory/scripts/review/ruled" <<< "$statuses" > /dev/null; then
              ruled=$((ruled + 1))
              continue
            fi
            if gh api -X POST "repos/$GH_REPO/actions/workflows/$stub/dispatches" \
                -f ref="$DEFAULT_BRANCH" -f "inputs[pr]=$number" > /dev/null; then
              dispatched=$((dispatched + 1))
            else
              echo "::error::Could not dispatch a review of PR #$number."
              exit_code=1
            fi
          done 3< "$RUNNER_TEMP/prs.tsv"
          echo "Backstop: $dispatched agent PR(s) dispatched for review, $ruled already ruled, $unread unreadable." \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"

  review:
    # A push to an agent PR by an allowlisted actor, or a backstop dispatch:
    # `pr` and no `ticket` (rework carries both, and is the implementer's),
    # fired by the backstop job with GITHUB_TOKEN, so by github-actions[bot].
    if: >-
      (github.event_name == 'pull_request'
        && (github.event.action == 'opened' || github.event.action == 'synchronize')
        && startsWith(github.event.pull_request.head.ref, 'agent/issue-')
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(format(',{0},', inputs.allowlist), format(',{0},', github.triggering_actor)))
      || (github.event_name == 'workflow_dispatch'
        && github.event.inputs.pr
        && !github.event.inputs.ticket
        && github.triggering_actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One review per PR: a new push cancels the stale one. A backstop review
    # doesn't cancel a running review: it waits behind it, and that review's
    # verdict then makes it skip. A group holds one pending run whatever
    # cancel-in-progress says, so a backstop dispatch does replace a pending
    # push review; it then reviews that same current head, and its verdict
    # replaces the replaced run's `error`. The group is the review's own, so reviews never cancel or
    # get cancelled by implementer runs. Any other event, a PR close among
    # them (handback's), gets a group of its own run, so it can't cancel a
    # review whether or not a skipped job takes its group (§13 item 15).
    concurrency:
      group: >-
        review-${{ (github.event.action != 'closed' && github.event.pull_request.number)
          || (!github.event.inputs.ticket && github.event.inputs.pr)
          || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Read-only, and no id-token: nothing the agent can reach can push, post
    # or set a status. The action gets this job's GITHUB_TOKEN rather than
    # minting a Claude App token.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    defaults:
      run:
        shell: bash
    # Read by post and report-failure, which runs even after a timeout or a
    # cancel (§13 item 4): the PR and head are set by the first step.
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      ticket: ${{ steps.context.outputs.ticket }}
      reviewed: ${{ steps.ruled.outputs.reviewed }}
      usage_limited: ${{ steps.usage.outputs.limited }}
    env:
      GH_REPO: ${{ github.repository }}
      RUN_DIR: .factory-run
    steps:
      # The plugin comes from the exact commit of this running workflow, moved
      # out of the workspace so the target checkout can't see or load it.
      - name: Check out the factory plugin
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory-plugin
          persist-credentials: false

      - name: Move the factory plugin out of the workspace
        run: |
          mv .factory-plugin "$RUNNER_TEMP/factory"
          echo "FACTORY=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"

      # A push carries its PR in the event; a backstop dispatch names only the
      # number, so the PR is read now, and its current head is the one
      # reviewed. Either way the PR must still be an open agent PR of this
      # repo (scripts/review/agent-prs); one that closed since is left alone.
      - name: Resolve the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_PR: ${{ github.event.inputs.pr }}
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pr_json="$(jq '.pull_request' "$GITHUB_EVENT_PATH")"
          elif [[ "$DISPATCHED_PR" =~ ^[1-9][0-9]*$ ]]; then
            pr_json="$(gh api "repos/$GH_REPO/pulls/$DISPATCHED_PR")"
          else
            echo "::error::The dispatched \`pr\` input is not a PR number."
            exit 1
          fi
          line="$(jq '[.]' <<< "$pr_json" | "$FACTORY/scripts/review/agent-prs" "$GH_REPO")"
          if [ -z "$line" ]; then
            echo "The PR is not an open agent PR of this repo; nothing to review." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          IFS=$'\t' read -r number head_sha head_ref base_ref base_tip <<< "$line"
          {
            echo "PR_NUMBER=$number"
            echo "HEAD_SHA=$head_sha"
            echo "HEAD_REF=$head_ref"
            echo "BASE_REF=$base_ref"
            echo "BASE_TIP=$base_tip"
          } >> "$GITHUB_ENV"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      # A re-delivered event, a re-run or the backstop never reviews the same
      # commit twice. A missing, `pending` or `error` status is not a verdict,
      # so the commit is reviewed. If the status can't be read, a push's commit
      # is reviewed rather than left without a verdict (fail-open); a backstop
      # review is not, and waits for the next night (fail-closed, as the
      # backstop job is).
      - name: Skip a commit already ruled on
        id: ruled
        if: env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! statuses="$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/status?per_page=100")"; then
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              echo "Could not read the status of $HEAD_SHA; left for the next backstop." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            statuses='{"statuses":[]}'
          fi
          if verdict="$("$FACTORY/scripts/review/ruled" <<< "$statuses")"; then
            echo "\`factory/review\` already ruled \`$verdict\` on $HEAD_SHA; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "REVIEW=true" >> "$GITHUB_ENV"
          echo "reviewed=true" >> "$GITHUB_OUTPUT"

      # Full history, for the merge-base. No persisted credentials.
      - name: Check out the PR head
        if: env.REVIEW == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      # The PR can't rewrite the standards it is reviewed against, or the
      # tools the reviewer loads: `.claude/`, `.mcp.json`, `CLAUDE.md` and the
      # standards files come from the base branch. Only the working tree
      # changes; the diff still shows what the PR does to them. The action may
      # restore some of these itself, but not reliably for a bot's PR run with
      # a `prompt`, so the factory does it.
      # No factory-setup: the review runs no code from the PR.
      - name: Prepare the review context
        id: context
        if: env.REVIEW == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$FACTORY/scripts/review/restore-base-config" "$BASE_TIP"
          merge_base="$(git merge-base "$BASE_TIP" HEAD)"
          echo "MERGE_BASE=$merge_base" >> "$GITHUB_ENV"

          # The run directory is git-ignored for this checkout only.
          mkdir -p "$RUN_DIR"
          echo "/$RUN_DIR/" >> .git/info/exclude

          gh pr view "$PR_NUMBER" --json body --jq '.body // ""' > "$RUN_DIR/pr-body.md"
          if ! ticket="$("$FACTORY/scripts/review/ticket-of" "$RUN_DIR/pr-body.md" "$HEAD_REF")"; then
            echo "::error::Neither the PR body nor the branch names a ticket."
            exit 1
          fi
          echo "TICKET=$ticket" >> "$GITHUB_ENV"
          echo "ticket=$ticket" >> "$GITHUB_OUTPUT"
          gh issue view "$ticket" --json number,title,body,comments \
            | "$FACTORY/scripts/ticket-thread" > "$RUN_DIR/ticket.md"

          git diff "$merge_base" HEAD > "$RUN_DIR/diff.patch"
          mkdir -p "$RUNNER_TEMP/verdict"
          "$FACTORY/scripts/review/diff-lines" < "$RUN_DIR/diff.patch" > "$RUNNER_TEMP/verdict/diff-lines.tsv"

      # The agent reads only what was prepared above and the checkout. Its
      # writes are two files, handed to the post job.
      - name: Review
        id: claude
        if: env.REVIEW == 'true'
        timeout-minutes: 12
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This job's read-only token instead of a minted Claude App token.
          github_token: ${{ github.token }}
          # The trigger is often claude[bot]'s own push, or the backstop's
          # dispatch by github-actions[bot]; the action refuses bot actors it
          # isn't told about.
          allowed_bots: "claude[bot],github-actions[bot]"
          prompt: |
            /factory:review
            PR: #${{ env.PR_NUMBER }}
            Ticket: #${{ env.TICKET }}
            Base: ${{ env.MERGE_BASE }} (merge-base with ${{ env.BASE_REF }})
            Head: ${{ env.HEAD_SHA }}
            Run directory: ${{ env.RUN_DIR }}/
          # allowed_bots turns off the action's default auto permission mode,
          # so every tool not allowed here is denied: reading, read-only git,
          # skills and sub-agents, and Write for the two files in the run
          # directory. Nothing written can leave the read-only job except
          # through the verdict artifact.
          # Opus: on the action's default model the review skipped its
          # parallel sub-agents and reviewed alone.
          claude_args: >-
            --model claude-opus-5-5
            --plugin-dir ${{ runner.temp }}/factory
            --add-dir ${{ runner.temp }}/factory
            --append-system-prompt-file ${{ runner.temp }}/factory/system.md
            --allowedTools "Read,Glob,Grep,Write,Skill,Agent,Task,TodoWrite,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(ls:*)"
            --disallowedTools "Bash(git push:*),Bash(git commit:*),Bash(gh:*)"

      # A review that ended on the usage limit is not a verdict (§10). The step
      # fails the job whatever the agent step's own outcome, so no verdict is
      # handed on or posted; report-failure sets `error` instead.
      # CLAUDE_CODE_RETRY_WATCHDOG stays unset, so the agent fails fast at the
      # limit rather than waiting out the reset.
      - name: Check for the usage limit
        id: usage
        if: always() && steps.claude.outcome != 'skipped'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: |
          if "$FACTORY/scripts/usage-limited" "$EXECUTION_FILE"; then
            echo "limited=true" >> "$GITHUB_OUTPUT"
            echo "::error::The agent hit the subscription's usage limit (rate_limit); no verdict."
            exit 1
          fi

      # The transcript, for seeing what the agent did and what it was denied
      # (docs/factory-design.md §11). A missing file is tolerated. It and the
      # job summary run after a failed, timed-out or cancelled agent step: its
      # timeout is shorter than the job's, so they still get time.
      - name: Upload the transcript
        id: transcript
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: review-transcript-${{ github.run_attempt }}
          path: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
          retention-days: 14
          if-no-files-found: ignore

      # Missing files are judged by the post job, which fails the run.
      - name: Hand the verdict to the post job
        if: env.REVIEW == 'true'
        run: cp "$RUN_DIR/outcome.json" "$RUN_DIR/review.json" "$RUNNER_TEMP/verdict/" 2>/dev/null || true

      - name: Upload the verdict
        if: env.REVIEW == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: review-verdict-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verdict/
          retention-days: 1

      # Deterministic, from what the steps above recorded. The verdict shown is
      # the one the post job will post; a missing or malformed outcome file
      # reads as `failed`, as the post job will judge it. The skills come from
      # the transcript's Skill calls, resolved against the base branch's
      # `.claude/`, which is what the agent loaded.
      - name: Write the job summary
        if: always() && env.REVIEW == 'true'
        env:
          FACTORY_SHA: ${{ job.workflow_sha }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
          JOB_STATUS: ${{ job.status }}
          USAGE_LIMITED: ${{ steps.usage.outputs.limited }}
          ARTIFACT_NAME: review-transcript-${{ github.run_attempt }}
          ARTIFACT_URL: ${{ steps.transcript.outputs.artifact-url }}
        run: |
          if [ "$USAGE_LIMITED" = "true" ]; then
            outcome="usage limit hit; \`factory/review\` set to \`error\`, not a verdict"
          elif [ "$JOB_STATUS" != "success" ]; then
            outcome="\`failed\` (job $JOB_STATUS)"
          elif verdict="$("$FACTORY/scripts/review/read-outcome" "$RUN_DIR/outcome.json" "$RUNNER_TEMP/summary-description.txt" 2>/dev/null)"; then
            outcome="review verdict \`$verdict\`, which the post job sets as \`factory/review\` (\"$(cat "$RUNNER_TEMP/summary-description.txt")\")"
          else
            outcome="\`failed\`: no valid outcome file, so the post job fails the run"
          fi
          {
            echo "### Review run"
            echo
            echo "- **Ticket:** ${TICKET:+#}${TICKET:-unknown}"
            echo "- **PR:** #$PR_NUMBER at \`$HEAD_SHA\`"
            echo "- **Outcome:** $outcome"
            "$FACTORY/scripts/run-figures" "$EXECUTION_FILE" \
              || echo "- **Turns, tokens and cost:** could not be read"
            "$FACTORY/scripts/run-summary" review "$RUN_DIR/outcome.json" "$FACTORY" "$FACTORY_SHA" "$BASE_TIP" "$EXECUTION_FILE" \
              || echo "- **Skills run:** could not be read"
            if [ -n "$ARTIFACT_URL" ]; then
              echo "- **Transcript:** [$ARTIFACT_NAME]($ARTIFACT_URL), kept 14 days; the factory's \`scripts/run-report $GH_REPO $GITHUB_RUN_ID\` digests it"
            else
              echo "- **Transcript:** none (no execution file was uploaded)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Deterministic: no agent runs here. It posts the review as claude[bot] and
  # sets `factory/review` with GITHUB_TOKEN. A missing or malformed outcome or
  # review file breaks the run, and the commit gets no verdict.
  post:
    needs: review
    if: needs.review.outputs.reviewed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
      id-token: write
    # Read by rework, which acts on a `fail`.
    outputs:
      verdict: ${{ steps.post.outputs.verdict }}
      review_url: ${{ steps.post.outputs.review_url }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PR_NUMBER: ${{ needs.review.outputs.pr_number }}
      HEAD_SHA: ${{ needs.review.outputs.head_sha }}
    steps:
      - name: Check out the factory plugin
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory-plugin
          persist-credentials: false

      - name: Download the verdict
        uses: actions/download-artifact@v4
        with:
          name: review-verdict-${{ github.run_attempt }}
          path: verdict

      - name: Post the review and set factory/review
        id: post
        run: |
          factory=.factory-plugin
          if ! verdict="$("$factory/scripts/review/read-outcome" verdict/outcome.json "$RUNNER_TEMP/description.txt")"; then
            echo "::error::The outcome file is missing or malformed."
            exit 1
          fi
          "$factory/scripts/review/review-payload" verdict/review.json verdict/diff-lines.tsv \
            "$HEAD_SHA" "$verdict" "$RUN_URL" > "$RUNNER_TEMP/review-payload.json"

          # Posted as claude[bot]: a GitHub App can only comment on a PR it
          # authored, never approve or request changes.
          token="$("$factory/scripts/implementer/claude-app-token" mint)"
          echo "::add-mask::$token"
          trap '"$factory/scripts/implementer/claude-app-token" revoke "$token"' EXIT
          review_url="$(GH_TOKEN="$token" gh api --method POST "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" \
            --input "$RUNNER_TEMP/review-payload.json" --jq .html_url)"

          # The verdict is a status set with GITHUB_TOKEN, whose events start no runs.
          case "$verdict" in pass) state=success ;; fail) state=failure ;; esac
          gh api --method POST "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state="$state" -f context=factory/review \
            -f description="$(cat "$RUNNER_TEMP/description.txt")" \
            -f target_url="$review_url" > /dev/null
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "review_url=$review_url" >> "$GITHUB_OUTPUT"
          {
            echo "Review verdict: \`$verdict\` ($(cat "$RUNNER_TEMP/description.txt"))"
            echo "Review: $review_url"
          } >> "$GITHUB_STEP_SUMMARY"

  # A `fail` sends the PR back to the implementer (§8.3); no agent runs here.
  # Rework is not a task of its own: the ticket goes back to `agent:ready` and
  # the stub is dispatched with ticket, PR and round, which the implementer
  # takes like any other run (the oldest ready ticket, continuing its open PR
  # and reading the review). Label writes with GITHUB_TOKEN start no runs, but
  # the dispatch does (§13 item 6). They come from github-actions[bot], so
  # they never reset the rework cap: rounds are `factory/review` failures on
  # the PR's commits since an allowlisted human last added `agent:ready`
  # (scripts/review/rework-round). Past REWORK_CAP the ticket goes to a human
  # instead. Only a fail on the PR's current head counts as a send-back, and
  # only a ticket still `agent:in-review` is moved: a newer push gets its own
  # review, and a ticket a human or a run has moved on is theirs. One rework
  # per PR at a time, so two quick fails can't both send the ticket back. A break here turns the run red but
  # leaves the verdict standing (report-failure doesn't wait on this job); a
  # ticket left `agent:ready` by a failed dispatch waits for the implementer's
  # daily backstop, with a comment saying so.
  rework:
    needs: [review, post]
    if: needs.post.outputs.verdict == 'fail'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: rework-${{ needs.review.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      actions: write
      issues: write
      pull-requests: read
      statuses: read
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
      STUB_REF: ${{ github.workflow_ref }}
      TICKET: ${{ needs.review.outputs.ticket }}
      PR_NUMBER: ${{ needs.review.outputs.pr_number }}
      HEAD_SHA: ${{ needs.review.outputs.head_sha }}
      REVIEW_URL: ${{ needs.post.outputs.review_url }}
      # The owner is whoever may trigger the implementer. This input stands in
      # for the implementer's, which this workflow can't read: the defaults
      # are kept equal (scripts/test/review-dispatch-contract.test.sh), and a
      # stub overrides both or neither.
      ALLOWLIST: ${{ inputs.allowlist }}
      # Automatic rounds before a human takes over (§10).
      REWORK_CAP: 2
    steps:
      - name: Check out the factory plugin
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory-plugin
          persist-credentials: false

      - name: Send the PR back for rework, or to a human at the cap
        run: |
          set -o pipefail
          factory=.factory-plugin
          head="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha)"
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "PR #$PR_NUMBER moved on from $HEAD_SHA; its new head gets its own review." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          labels="$(gh issue view "$TICKET" --json labels --jq '[.labels[].name] | join(",")')"
          if [[ ",$labels," != *",agent:in-review,"* ]]; then
            echo "Ticket #$TICKET is not \`agent:in-review\` ($labels); left as it is." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api --paginate --slurp "repos/$GH_REPO/issues/$TICKET/events?per_page=100" \
            | jq 'add // []' > "$RUNNER_TEMP/events.json"
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/commits?per_page=100" \
            | jq -r 'add // [] | .[].sha' > "$RUNNER_TEMP/commits.txt"
          while read -r sha; do
            gh api --paginate --slurp "repos/$GH_REPO/commits/$sha/statuses?per_page=100" \
              | jq 'add // []' || exit 1
          done < "$RUNNER_TEMP/commits.txt" | jq -s 'add // []' > "$RUNNER_TEMP/statuses.json"
          # Captured first: a failure inside `read <<<` would be masked.
          decided="$("$factory/scripts/review/rework-round" "$ALLOWLIST" "$REWORK_CAP" \
            "$RUNNER_TEMP/events.json" "$RUNNER_TEMP/statuses.json")"
          read -r decision count <<< "$decided"

          if [ "$decision" = "needs-human" ]; then
            gh issue comment "$TICKET" --body-file - <<EOF
          The automated review failed PR #$PR_NUMBER $count times since \`agent:ready\` was last added, past the $REWORK_CAP automatic rework rounds, so the ticket comes back to you. Latest review: $REVIEW_URL

          Fix the PR or the ticket, then re-add \`agent:ready\`, which resets the count.

          Run: $RUN_URL
          EOF
            gh issue edit "$TICKET" --remove-label agent:in-review --add-label agent:needs-human
            echo "Rework cap: review failed $count times; ticket #$TICKET handed to a human." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Ready first: the dispatched run takes the oldest ready ticket.
          gh issue edit "$TICKET" --remove-label agent:in-review --add-label agent:ready
          # STUB_REF is "<owner>/<repo>/.github/workflows/<file>@<ref>".
          stub="${STUB_REF%%@*}"
          stub="${stub##*/}"
          # A failed dispatch leaves the ticket `agent:ready` for the daily
          # backstop; the comment says so, since the red run is easy to miss.
          if ! gh api -X POST "repos/$GH_REPO/actions/workflows/$stub/dispatches" -f ref="$DEFAULT_BRANCH" \
              -f "inputs[ticket]=$TICKET" -f "inputs[pr]=$PR_NUMBER" -f "inputs[round]=$count" > /dev/null; then
            gh issue comment "$TICKET" --body-file - <<EOF
          The automated review failed PR #$PR_NUMBER (rework round $count of $REWORK_CAP), but dispatching the rework run failed. The ticket stays \`agent:ready\`, so the next daily backstop picks it up. Latest review: $REVIEW_URL

          Run: $RUN_URL
          EOF
            echo "::error::Could not dispatch the rework run; ticket #$TICKET waits for the daily backstop."
            exit 1
          fi
          echo "Rework round $count of $REWORK_CAP: ticket #$TICKET is \`agent:ready\` again and \`$stub\` dispatched." \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # An agent PR closed without merging hands its ticket back to the owner (§5
  # Ticket ↔ PR, §13 item 13): `agent:in-review` → `agent:needs-human`, with a
  # comment. No agent runs here. It lives in the stub's path rather than the
  # board sweep's because GITHUB_TOKEN's label write starts no run, where the
  # sweep's PAT would write as the owner and start a no-op implementer run.
  # No allowlist: closing a PR takes write access, and the hand-back starts
  # nothing. Only a ticket still open and `agent:in-review` is moved: one a
  # human or a run has moved on, or closed, is left alone. A merge closes the
  # ticket itself.
  handback:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && !github.event.pull_request.merged
      && startsWith(github.event.pull_request.head.ref, 'agent/issue-')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out the factory plugin
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory-plugin
          persist-credentials: false

      - name: Hand the ticket back to the owner
        run: |
          set -o pipefail
          if ! ticket="$(jq '.pull_request' "$GITHUB_EVENT_PATH" \
              | .factory-plugin/scripts/review/handback-ticket "$GH_REPO")"; then
            echo "::error::PR #$PR_NUMBER could not be read from the event, or neither its body nor its branch names a ticket."
            exit 1
          fi
          if [ -z "$ticket" ]; then
            echo "PR #$PR_NUMBER is merged or not an agent PR of this repo; nothing to hand back." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Captured first: a failure inside `read <<<` would be masked.
          issue="$(gh issue view "$ticket" --json state,labels \
            --jq '"\(.state) \([.labels[].name] | join(","))"')"
          read -r state labels <<< "$issue"
          if [ "$state" != "OPEN" ] || [[ ",$labels," != *",agent:in-review,"* ]]; then
            echo "Ticket #$ticket is not open and \`agent:in-review\` ($state, $labels); left as it is." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh issue comment "$ticket" --body-file - <<EOF
          PR #$PR_NUMBER was closed without merging, so the ticket comes back to you.

          Re-add \`agent:ready\` for a fresh attempt from the default branch, or close the ticket.

          Run: $RUN_URL
          EOF
          gh issue edit "$ticket" --remove-label agent:in-review --add-label agent:needs-human
          echo "PR #$PR_NUMBER closed unmerged; ticket #$ticket handed to a human." | tee -a "$GITHUB_STEP_SUMMARY"

  # Anything that breaks the run (a failed step or job, a malformed outcome
  # file, a timeout, a cancel) sets `factory/review` to `error` with the run
  # link (§8 Failure behaviour); a usage limit says so (§10). `error` is not a
  # verdict, so the next push or backstop reviews the commit again
  # (scripts/review/ruled). The ticket stays `agent:in-review`. A separate job,
  # because a timed-out or cancelled job skips its own `failure()` steps.
  # It never replaces a verdict: a run cancelled after another run ruled on
  # the same commit leaves that verdict standing. Set with GITHUB_TOKEN, whose
  # events start no runs.
  report-failure:
    needs: [review, post]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # A review cancelled before it started set no outputs; a push still
      # names its head.
      HEAD_SHA: ${{ needs.review.outputs.head_sha || github.event.pull_request.head.sha }}
      USAGE_LIMITED: ${{ needs.review.outputs.usage_limited }}
    steps:
      - name: Check out the factory plugin
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory-plugin
          persist-credentials: false

      - name: Set factory/review to error
        run: |
          if [ -z "$HEAD_SHA" ]; then
            echo "The run broke before it knew which commit to review; nothing to mark. The next backstop finds any unruled head." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if statuses="$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/status?per_page=100")" \
            && verdict="$(.factory-plugin/scripts/review/ruled <<< "$statuses")"; then
            echo "\`factory/review\` already ruled \`$verdict\` on $HEAD_SHA; left as it is." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$USAGE_LIMITED" = "true" ]; then
            description="usage limit hit; not reviewed yet"
          else
            description="review run broke; not reviewed yet"
          fi
          gh api --method POST "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state=error -f context=factory/review \
            -f description="$description" \
            -f target_url="$RUN_URL" > /dev/null
          echo "\`factory/review\` set to \`error\` on $HEAD_SHA: $description." | tee -a "$GITHUB_STEP_SUMMARY"
